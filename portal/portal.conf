# Rendered by hand -> /etc/apache2/conf-available/portal.conf
#
#   a2enmod headers && a2enconf portal && apache2ctl configtest && systemctl reload apache2
#
# The portal takes the web root because the thin clients open http://lanparty.lan.party/
# as their browser homepage. The /pxe, /games and /windrv aliases are more specific and
# keep working; Apache prefers the longest matching Alias.

Alias / /srv/portal/

<Directory /srv/portal>
    Options -Indexes +FollowSymLinks
    # data/.htaccess denies the database and the uploaded plan. Apache ignores
    # .htaccess entirely without this, and the deny would fail silently.
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>

# Server-sent events. Compression buffers the stream, so events arrive in clumps or not
# at all; see README.md, "SSE, and the four ways it breaks".
<Files "events.php">
    SetEnv no-gzip 1
    Header set X-Accel-Buffering "no"
</Files>

# Every connected browser holds one Apache worker for the life of its SSE stream, and
# mod_php means prefork. Raise this above the expected headcount or late arrivals hang
# waiting for a worker that never frees up.
<IfModule mpm_prefork_module>
    MaxRequestWorkers 180
</IfModule>
